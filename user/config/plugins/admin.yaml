# Логотип админки текстом.
#
# Шаблоны login-logo.html.twig и logo.html.twig подключают SVG из
# пространства имён @admin-images. Оно регистрируется от папки
# user/plugins/admin/themes/grav/images/, а её в поставке нет: правило
# `images/` в .gitignore срабатывало на любом уровне вложенности, поэтому
# папку никогда не коммитили. Сайт разворачивается через git-sync — из-за
# этого админка отдавала 500 и локально, и на бою.
#
# Ветка logo_text в обоих шаблонах идёт первой и обходит @admin-images
# целиком, так что чужой плагин править не пришлось.
logo_text: 'Центр гематологии'
